# qidi_calibration_q2.cfg - QIDI Q2 machine settings for the auto-calibration
#
# Copyright (C) 2026  Budd
# Licensed under PolyForm Strict 1.0.0 - see LICENSE.md.
#
# Add this to the printer with:
#     [include qidi_calibration_q2.cfg]
# ABOVE the "#*# <---------------------- SAVE_CONFIG" marker in printer.cfg.
# Klipper rewrites everything below that line, so anything placed after it is
# destroyed on the next save.
#
# WHY A Q2 FILE AT ALL - the toolhead is identical, the machine is not
#   Verified against QIDI's own firmware, both the 2026-01 GitHub release and
#   the current 01.01.02.04 (2026-08-05) package:
#
#     identical to the X-Max 4    [probe_air] c_sensor on THR:PB3 / THR:PB4,
#                                 voltage 4.95, delta_v 0.08
#                                 extruder rotation_distance 53.7,
#                                 gear_ratio 1517:170
#                                 every extrusion guard disabled
#                                 (max_extrude_only_velocity 5000, etc.)
#
#     DIFFERENT                   nozzle 0.4 (X-Max 4 is 0.6)
#                                 bed 275 x 295, Z 265 (X-Max 4 is 390 x 390)
#                                 park/trash X85 Y287.5 (X-Max 4: X135 Y403)
#                                 wiper X95-115 (X-Max 4: park_x+8..+27)
#                                 NO [gcode_macro _km_globals]
#
#   That last one is why park_x is set here explicitly. On the X-Max 4 the
#   modules read park_x from _km_globals; the Q2 has no such macro, and the
#   modules refuse to run rather than fall back to a guess - a hardcoded 135
#   would put the wipe most of the way across a 275 mm bed.

# --------------------------------------------------------------------------
# Stage 1 - max volumetric flow
# --------------------------------------------------------------------------
[qidi_flow_ramp]
# MEASURED ON ONE Q2 - 15 points, 8.5 gf to 2063 gf - see README, "The one
# number you must measure yourself". This is NOT a constant of the design:
# the X-Max 4 cell measured 182.96, this one 201, an 11% difference between
# two machines of the same family. The force abort is the only overload
# protection this printer has, so it means nothing numerically until this
# figure is right for YOUR cell.
#
# 201 rather than the 205 a full-range fit gives, deliberately. The slope
# drifts from ~208 mid-range to ~200 at the top, and the abort lives at the
# top. Configuring low makes the abort fire EARLY, which is the safe
# direction; configuring high makes it fire late.
counts_per_gf: 201

# The purge chute. QIDI's MOVE_TO_TRASH parks at X85 Y287.5.
park_x: 85

# The wiper, as offsets from park_x. QIDI's own CLEAR_NOZZLE_PLR oscillates
# between X95 and X115, i.e. park_x + 10 to park_x + 30.
wipe_lo_offset: 10
wipe_hi_offset: 30

# --------------------------------------------------------------------------
# Stage 2 - the flow points (pure maths)
# --------------------------------------------------------------------------
[qidi_pa_envelope]
# Q2 ships a 0.4 nozzle. QIDI's own standard profile for it is 0.20 layer /
# 0.42 width. The PA table is only valid for the geometry it was measured at.
layer_height: 0.20
line_width: 0.42

# --------------------------------------------------------------------------
# Stage 3 - pressure advance
# --------------------------------------------------------------------------
[qidi_pa_measure]
# Must match [qidi_flow_ramp]. The two stages abort independently, and a value
# in only one of them leaves the other running on the shipped default.
counts_per_gf: 201
park_x: 85
wipe_lo_offset: 10
wipe_hi_offset: 30

# --------------------------------------------------------------------------
# Stage 4 and the front door
# --------------------------------------------------------------------------
[qidi_pa_table]

[qidi_auto_cal]

[qidi_cal_wizard]
nozzle_diameter: 0.4

# --------------------------------------------------------------------------
# The bed routine - QIDI_AUTO_CALIBRATE_BED, for filament that will not clear
# the purge chute reliably. See CHANGELOG/2026-09-22-bed-routine.md.
# --------------------------------------------------------------------------
[qidi_flow_bed_search]
counts_per_gf: 201
park_x: 85
wipe_lo_offset: 10
wipe_hi_offset: 30

[qidi_pa_bed_measure]
counts_per_gf: 201
park_x: 85
wipe_lo_offset: 10
wipe_hi_offset: 30

[qidi_auto_cal_bed]
# 200 mm drop, 65 mm of margin against the real 265 mm max travel
# ([stepper_z] position_max in QIDI's own printer.cfg) - see the CHANGELOG
# entry above for why this is 265, not the 256 originally quoted.
bed_down_z: 200
bed_down_feed: 1200

# QIDI_CALIBRATE_BED - the dialog front door for the bed routine, matching
# QIDI_CALIBRATE. See CHANGELOG/2026-09-23-bed-wizard.md.
[qidi_cal_wizard_bed]
nozzle_diameter: 0.4

# --------------------------------------------------------------------------
# Read-only diagnostics. QIDI_CS_READ is the first thing the README asks you
# to run, so keep at least that one.
# --------------------------------------------------------------------------
[qidi_cs_read]
[qidi_cs_locate]
[qidi_cs_proto]
[qidi_cs_timing]
[qidi_cs_clock]
[qidi_cs_validate]
[qidi_cs_bulk]
[qidi_cs_batch]
